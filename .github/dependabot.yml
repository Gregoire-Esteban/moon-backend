version: 2
updates:
- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "cron"
    cronjob: "0 20 * * 0" # Every sunday at 8 p.m.
  exclude-paths:
    - "src/*.py"
    - "test/**"
    - "local/**"
    - "deployment/**"
    - "**/*.md"
    - ".*"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "cron"
    cronjob: "0 10 9 * *" # Every 9th day of the month at 10 a.m.
  exclude-paths:
    - "src/*.py"
    - "test/**"
    - "local/**"
    - "deployment/**"
    - "**/*.md"
    - ".*"

- package-ecosystem: "terraform"
  directory: "/deployment/google_cloud/infra"
  schedule:
    interval: "cron"
    cronjob: "0 15 * * 3" # Every wednesday at 3 p.m.
  exclude-paths:
    - ".*"

- package-ecosystem: "terraform"
  directory: "/deployment/google_cloud/registry"
  schedule:
    interval: "cron"
    cronjob: "30 15 * * 3" # Every wednesday at 3:30 p.m.
  exclude-paths:
    - ".*"

- package-ecosystem: "docker-compose"
  directory: "/"
  schedule:
    interval: "weekly"
    day: saturday
    time: "15:30"
  exclude-paths:
    - "src/**"
    - "test/**"
    - "local/**"
    - "deployment/**"
    - "**/*.md"
    - ".*"
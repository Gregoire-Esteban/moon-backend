# This workflow will install Python dependencies, run tests on a single version of Python with UV
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI-CD

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "deploy/**" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "deploy/**" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.versionning.outputs.app_version }}
    steps:
    - uses: actions/checkout@v6

    - name: "Set up Python"
      uses: actions/setup-python@v6
      with:
        python-version-file: "pyproject.toml"
    
    # TODO : check latest version of this action + remove aws-related steps
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: "Set up the project"
      run: uv sync --locked --all-extras --dev

    - name: "Run unit tests"
      run: uv run pytest test
    
    # TODO : maybe extract the two following steps in a dedicated job ? (and move them to release-docker.yml)
    - id: versionning
      run: |
        version=$(uv version | cut -d' ' -f2)
        echo "APP_VERSION=${version}" >> $GITHUB_OUTPUT
      
    - name: Verify
      run : |
        echo APP_VERSION: ${{ steps.versionning.outputs.app_version }}

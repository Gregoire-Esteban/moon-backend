name: "Release : Docker"
#  Build, tag and push the image to the Amazon ECR

on: 
# Triggered manually
  workflow_dispatch:
    inputs:
      app_version:
        description: "Version for the Docker image tag"
        required: true

# Triggered by ci-cd.yml
  workflow_call:
    inputs:
      app_version:
        required: true
        type: string

permissions:
      contents: read
      id-token: write # Necessary in the process of OCID connection to aws
env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: wazapps/moon-backend

jobs:
  release-docker:
    name: Release Docker
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5.1.1
      with:
        role-to-assume: MoonBackendGithubRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      shell: bash
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ format('{0}-{1}', (github.event.inputs.app_version || inputs.app_version), github.sha) }}
      run: |
        # Build a docker container image and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
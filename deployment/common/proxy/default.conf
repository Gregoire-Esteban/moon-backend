limit_req_dry_run on;
#limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s; Set up after evaluating real traffic
server {
    listen 80;
    server_name localhost;
    server_tokens off;
    
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Strict-Transport-Security "max-age=9600" always;
    add_header Content-Security-Policy "default-src 'self'; font-src *;img-src * data:; script-src *; style-src *";

    root /usr/share/nginx/html;
    index index.html;               
    location /static/ {
        alias /usr/share/nginx/html/;
        try_files $uri =404;  
    }

    # Refuse access to dotfiles
    location ~ /\. {
        deny all;
    }

    # Prevent from using other HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location / {
        # limit_req zone=perip burst=10 nodelay; Set up after evaluating real traffic
        # limit_conn perip 10; Set up after evaluating real traffic
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 45s;
        proxy_pass         http://challenger:8923; 
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
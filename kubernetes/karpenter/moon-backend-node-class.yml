apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: moon-backend-node-class
spec:
  # Required, discovers subnets to attach to instances
  # Each term in the array of securityGroupSelectorTerms is ORed together
  # Within a single term, all conditions are ANDed
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
        environment: preprod
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
        environment: prod

  # Required, discovers security groups to attach to instances
  # Each term in the array of securityGroupSelectorTerms is ORed together
  # Within a single term, all conditions are ANDed
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
        environment: preprod
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
        environment: prod

  amiSelectorTerms:
    # Select EKS optimized AL2023 AMIs with version `v20260216`
    - alias: al2023@v20260216 

  # Optional, configures detailed monitoring for the instance
  # detailedMonitoring: true

  # Optional, configures if the instance should be launched with an associated public IP address.
  # If not specified, the default value depends on the subnet's public IP auto-assign setting.
  # associatePublicIPAddress: true
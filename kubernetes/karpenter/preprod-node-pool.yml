apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: preprod-node-pool
  namespace: preprod-moon
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      taints: []
      requirements:
        - key: "eks.amazonaws.com/instance-family"
          operator: In
          values: ["t4g"]
        - key: "eks.amazonaws.com/instance-size"
          operator: In
          values: ["micro", "small"]
        - key: "topology.kubernetes.io/zone"
          operator: In
          values: ["eu-north-1a", "eu-north-1b"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["arm64", "amd64"]
      expireAfter: 360h #15 days
      terminationGracePeriod: 1h

  limits:
    cpu: 24
    memory: 100Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

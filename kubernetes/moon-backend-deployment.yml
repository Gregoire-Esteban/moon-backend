apiVersion: apps/v1
kind: Deployment
metadata:
  name: moon-backend
  labels:
    app: moon-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moon-backend
  template:
    metadata:
      labels:
        app: moon-backend
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      containers:
      - name: moon-backend
        image: 293415643635.dkr.ecr.eu-north-1.amazonaws.com/wazapps/moon-backend:0.1.0-67c27f2358bd2549e082c85bdba6d4054871fda0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
            allowPrivilegeEscalation: false

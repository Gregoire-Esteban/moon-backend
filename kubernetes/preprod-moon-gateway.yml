apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: preprod-moon-gateway
  namespace: preprod-moon
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      name: agentgateway-config
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
  - protocol: HTTP
    port: 80
    name: preprod-moon-gw
    allowedRoutes:
      namespaces:
        from: Same

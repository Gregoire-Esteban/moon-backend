apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preprod-moon-httproute
spec:
  parentRefs:
  - name: preprod-moon-gateway
  hostnames:
  - "preprod.moon.wazapps.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: backend-service
      port: 80
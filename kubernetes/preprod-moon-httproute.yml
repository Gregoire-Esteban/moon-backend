apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preprod-moon-httproute
  namespace: preprod-moon
spec:
  parentRefs:
    - name: preprod-moon-gateway
      namespace: preprod-moon
  hostnames:
    - "preprod.moon.wazapps.dev"
  rules:
    - backendRefs:
      - name: backend-service
        port: 80

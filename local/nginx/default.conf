# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name moonbe.example.lel anubis.example.lel;

    return 301 https://$host$request_uri;
}

# Anubis itself, served without auth so the challenge page is always reachable
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anubis.example.lel;

    ssl_certificate     /certs/ssl_certificate.crt;
    ssl_certificate_key /certs/ssl_private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://anubis:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-TLS-SNI-Name $ssl_server_name;
    }
}

# Protected API behind Anubis via nginx auth_request (subrequest auth)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name moonbe.example.lel;

    ssl_certificate     /certs/ssl_certificate.crt;
    ssl_certificate_key /certs/ssl_private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /ready {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /moon {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

[project]
name = "moon_backend"
version = "0.1.0"
description = "Wanna know more about the moon ?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "fastapi[standard]>=0.143.3",
    "certifi>=2026.10.23"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "launcher"},
  {include-group = "tests"},
]
lint = [
  "ruff>=0.16.10",
]
launcher = [
  "fastapi-cli>=0.0.32",
]
tests = [
  "pytest>=9.1.1",
  "time-machine>=3.5.1",
]

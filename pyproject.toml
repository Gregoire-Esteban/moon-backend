[project]
name = "moon_backend"
version = "0.1.0"
description = "Wanna know more about the moon ?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.129.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "launcher"},
  {include-group = "tests"},
]
lint = [
  "ruff>=0.15.0",
]
launcher = [
  "fastapi-cli>=0.0.21",
]
tests = [
  "pytest>=9.0.2",
  "time-machine>=3.2.0",
]